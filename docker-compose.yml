# ---------------------------------------------------------------------------
# Full stack: inference backend + web app.
#
#   docker compose up --build
#   web      -> http://localhost:5173
#   backend  -> http://localhost:8000/docs
#
# The web container talks to the backend over the compose network, and vite
# proxies /api, /health and /ws so the browser only ever uses its own origin.
# ---------------------------------------------------------------------------
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SIGNORA_HOST: 0.0.0.0
      SIGNORA_PORT: "8000"
      SIGNORA_PRELOAD_MODELS: "false"
    ports:
      - "8000:8000"
    volumes:
      # Comment this out to use the weights baked into the image instead.
      - ./models:/app/models:ro
      - backend-data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      SIGNORA_BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  backend-data:
