# ---------------------------------------------------------------------------
# Vercel API deployment (Python runtime).
#
# The Vercel project for the API keeps its Root Directory at the repository
# root (".") and uses the FastAPI preset: the entrypoint below resolves the
# ASGI app in backend/app/main.py, and the models/** weights are attached to
# the function via vercel.json. For local development keep using
# backend/requirements.txt (which also lists the test dependencies).
# ---------------------------------------------------------------------------
[project]
name = "signora-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.137",
  "uvicorn[standard]>=0.49",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pillow>=10.2",
  "torch>=2.2",
  "torchvision>=0.17",
  "tensorflow-cpu>=2.16; platform_machine == 'x86_64'",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
